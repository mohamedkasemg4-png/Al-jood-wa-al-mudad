<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة التبرع</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #fff;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        textarea {
            resize: vertical;
        }

        .buttons {
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background: #4CAF50;
            color: #fff;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        button:hover {
            background: #45a049;
        }

        .lang-switch {
            background: #2196F3;
        }

        .donate-fast {
            background: #f44336;
        }

        .share {
            background: #ff9800;
        }

        .book {
            background: #9c27b0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 id="title">نموذج التبرع</h2>

        <label id="label-name">الاسم:</label>
        <input type="text" id="name" placeholder="ادخل اسمك">

        <label id="label-email">البريد الإلكتروني:</label>
        <input type="email" id="email" placeholder="ادخل بريدك">

        <label id="label-phone">رقم الهاتف:</label>
        <input type="tel" id="phone" placeholder="ادخل رقمك">

        <label id="label-amount">المبلغ:</label>
        <input type="number" id="amount" placeholder="ادخل مبلغ التبرع">

        <label id="label-message">رسالة:</label>
        <textarea id="message" rows="4" placeholder="اكتب رسالتك"></textarea>

        <div class="buttons">
            <button onclick="donate()">تبرع الآن</button>
            <button class="book" onclick="book()">احجز</button>
            <button class="share" onclick="share()">شارك</button>
            <button class="donate-fast" onclick="fastDonate()">تبرع سريع 102030</button>
            <button class="lang-switch" onclick="switchLang()">English/عربي</button>
        </div>
    </div>

    <script>
        // دعم لغتين عربي وإنجليزي
        let lang = 'ar';
        function switchLang() {
            if(lang === 'ar') {
                lang = 'en';
                document.getElementById('title').innerText = "Donation Form";
                document.getElementById('label-name').innerText = "Name:";
                document.getElementById('label-email').innerText = "Email:";
                document.getElementById('label-phone').innerText = "Phone:";
                document.getElementById('label-amount').innerText = "Amount:";
                document.getElementById('label-message').innerText = "Message:";
            } else {
                lang = 'ar';
                document.getElementById('title').innerText = "نموذج التبرع";
                document.getElementById('label-name').innerText = "الاسم:";
                document.getElementById('label-email').innerText = "البريد الإلكتروني:";
                document.getElementById('label-phone').innerText = "رقم الهاتف:";
                document.getElementById('label-amount').innerText = "المبلغ:";
                document.getElementById('label-message').innerText = "رسالة:";
            }
        }

        function donate() {
            alert("شكراً لتبرعك!");
        }

        function book() {
            alert("تم حجزك بنجاح!");
        }

        function share() {
            alert("تم نسخ رابط المشاركة!");
        }

        function fastDonate() {
            // فتح رابط الاتصال برقم 102030
            window.location.href = "tel:102030";
        }
    </script>
</body>
</html>
